# Prod : l'app et Postgres. Nginx Proxy Manager fait le HTTPS devant (coc.maxperso.fr → hôte:APP_PORT).
# Lancement : cp .env.example .env, remplir, puis docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coc
      POSTGRES_USER: coc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définis POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coc -d coc"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: coc-tracker:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://coc:${POSTGRES_PASSWORD}@db:5432/coc
      JWT_SECRET: ${JWT_SECRET:?définis JWT_SECRET dans .env}
      INVITE_CODE: ${INVITE_CODE:-}
      APP_ORIGIN: ${APP_ORIGIN:-https://coc.maxperso.fr}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      SMTP_HOST: ${SMTP_HOST:?définis SMTP_HOST dans .env (emails de confirmation)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?définis MAIL_FROM dans .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # Vide : l'adresse du site (APP_ORIGIN). Apple refuse les adresses de test comme « localhost ».
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      # APP_BIND : mets l'IP sur laquelle Nginx Proxy Manager joint l'hôte, pour ne pas exposer l'app en HTTP clair.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
